## Uncomment the rule blocks you want and adapt their paths. All example rules
## and optional limits start disabled. Built-in self-protection, markers, and
## default symlink/submodule/mode-change protections remain enabled.
#
## twokey policy. Lives at the repo root as .twokey.toml.
#
## In CI this file is read from the BASE of the pull request, never from the PR
## itself, so a change can't relax its own rules. Edits to this file (and to all
## other twokey config, see [settings]) are always denied for AI
## (built-in rules `twokey-policy` and `twokey-wiring`).
#
## Actions, mildest to strictest:  allow · warn · deny
#   deny    = AI-authored changes may never touch this; a human has to do it
## `action` applies to AI-attributed changes, `human_action` (default allow) to the rest.
version = 1

[settings]
enforce = true                        # false = report-only while you tune the policy
case_insensitive_paths = true
default_base = "origin/main"          # used by the agent hook when it sees `git push`
## Always protected without listing them (built in, can't be turned off): every
## .twokey.toml, .twokey/**, .github/twokey/**, and any CI/hook/agent config
## (.github/workflows, .claude, .githooks, .husky, pre-commit, lefthook, GitLab,
## CircleCI, Buildkite, Jenkins, Azure, Bitbucket) that mentions twokey.
# protect = [".githooks/**"]            # extra paths that get the same treatment
## Monorepos: per-directory policies that can only ADD rules, scoped to their dir.
# include = ["services/*/.twokey.toml"]

[ai]
## Untagged changes are AI by default, including local models with no AI metadata.
assume_ai = true
## Required and non-empty when assume_ai = false; omission is a policy error.
## Matched against each trimmed line of the commit message (case-insensitive).
trailers = [
  '(?i)^co-authored-by:.*\b(claude|anthropic|copilot|codex|openai|cursor|devin|gemini|aider|windsurf|jules|amazon q|codeium)\b',
  '(?i)^(ai-)?(assisted|generated)-by:',
]

## Choose the literal marker for fully human commits (not a regex).
human_marker = "#Human"  # alternatively: "#Human"
## Put your marker on its own line after a blank line at the end of the message.
## Explicit AI signals still win over that declaration.
## With assume_ai = false, only these signals identify AI; unmatched changes
## are treated as human without needing human_marker. Untagged local AI may pass.
## The authors, branches, and env defaults below apply even while commented out.
## Uncomment those lists to replace their defaults; [] disables that signal.
## Message/identity/branch patterns are regexes; TOML single quotes preserve \.
## Explicit AI signals also apply when assume_ai = true and override human_marker.

## Matched against both author and committer as "Name <email>".
# authors = [
#   '(?i)noreply@anthropic\.com',
#   '(?i)\[bot\]',
#   '(?i)\b(copilot|codex|devin|cursor)\b.*@',
# ]

## A matching source branch marks the entire checked range as AI.
# branches = ['^(claude|codex|copilot|cursor|devin|ai|agent|bot)[/-]']

## Local checks only: any non-empty value counts, including "0" or "false".
## These are literal environment variable names, not regexes.
# env = ["CLAUDECODE", "TWOKEY_AI"]
## Agent hooks always treat edits as AI, regardless of assume_ai or these lists.

[markers]
## In-file markers, read from the base version:
#   // twokey:lock-begin <reason>   ...   // twokey:lock-end     -> deny
#   /* twokey:lock-file */                                    -> whole file
enabled = true
lock_action = "deny"

# [limits]
# max_files = 60
# max_changed_lines = 3000
# max_deleted_files = 10
# action = "deny"
# symlinks = "deny"
# submodules = "deny"
# mode_changes = "deny"
# binary = "warn"

