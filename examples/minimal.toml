# Copy to .twokey.toml at the root of your repository.
# Replace "your-github-login" and adapt the paths before enabling CI.
version = 1

[approvals]
approvers = ["your-github-login"]

[[rule]]
id = "protect-ci"
kind = "path"
paths = ["/.github/workflows/**", "/.github/CODEOWNERS", "/CODEOWNERS"]
action = "deny"
reason = "CI and review routing must be changed by a human."

[[rule]]
id = "review-auth"
kind = "path"
paths = ["/src/auth/**"]
action = "approve"
reason = "Authentication changes require human review."
